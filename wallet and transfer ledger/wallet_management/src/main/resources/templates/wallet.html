<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallet</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Wallet Details</h1>

    <input
            type="number"
            id="walletId"
            placeholder="Enter Wallet ID"
    >

    <button onclick="loadWallet()">
        View Wallet
    </button>

    <div id="result"></div>

    <br>

    <a href="/">Back to Dashboard</a>

</div>

<script>

    async function loadWallet() {

        const walletId = document.getElementById("walletId").value;

        if (!walletId) {
            alert("Please enter Wallet ID");
            return;
        }

        try {

            const response = await fetch(`/wallets/${walletId}`);

            if (!response.ok) {
                throw new Error("Wallet not found");
            }

            const wallet = await response.json();

            document.getElementById("result").innerHTML = `
                <h2>Wallet ID: ${wallet.id}</h2>
                <p><strong>Balance:</strong> ₹${wallet.balance}</p>
                <p><strong>Created At:</strong> ${wallet.createdAt}</p>
                <p><strong>Updated At:</strong> ${wallet.updatedAt}</p>
            `;

        } catch (error) {

            document.getElementById("result").innerHTML =
                `<p>${error.message}</p>`;

        }
    }

</script>

</body>
</html>
