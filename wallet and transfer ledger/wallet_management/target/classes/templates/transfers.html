<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transfers</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Transfer History</h1>

    <button onclick="loadTransfers()">
        View Transfers
    </button>

    <div id="result"></div>

    <br>

    <a href="/">Back to Dashboard</a>

</div>

<script>

    async function loadTransfers() {

        try {

            const response =
                await fetch("/transfers?page=0&size=10");

            if (!response.ok) {
                throw new Error("Unable to load transfers");
            }

            const data = await response.json();

            let transfers = data.content || data;

            let html = `
                <table>

                    <tr>
                        <th>ID</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
            `;

            transfers.forEach(transfer => {

                html += `
                    <tr>
                        <td>${transfer.id}</td>
                        <td>₹${transfer.amount}</td>
                        <td>${transfer.status}</td>
                        <td>${transfer.createdAt || "-"}</td>
                    </tr>
                `;

            });

            html += `</table>`;

            document.getElementById("result").innerHTML = html;

        } catch (error) {

            document.getElementById("result").innerHTML =
                `<p>${error.message}</p>`;

        }
    }

</script>

</body>
</html>
